name: verify
on:
  pull_request:
  push:
    branches: [main]
    # The scheduled news job commits a generated file every few hours; there
    # is no code in it to verify.
    paths-ignore: [data/news.json]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
      - run: npm run check
      - run: npm run test:rules
      - run: npm run build
